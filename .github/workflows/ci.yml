name: Tests, releases, and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: '1.24.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Static analysis
        run: go vet ./...
      - name: Race-enabled tests
        run: make test TEST_FLAGS="-race -count=1"

  binaries:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          make build
          mkdir dist
          name="restic-studio-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then
            mv restic-studio restic-studio.exe
            zip "dist/${name}.zip" restic-studio.exe README.md DEVELOPMENT.md testdata/autorestic.example.yml
          else
            tar -czf "dist/${name}.tar.gz" restic-studio README.md DEVELOPMENT.md testdata/autorestic.example.yml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: restic-studio-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  site:
    name: Generate documentation site
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        with:
          path: _site/

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, binaries, site, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: restic-studio-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          files=(
            restic-studio-linux-amd64.tar.gz
            restic-studio-linux-arm64.tar.gz
            restic-studio-darwin-amd64.tar.gz
            restic-studio-darwin-arm64.tar.gz
            restic-studio-windows-amd64.zip
            restic-studio-windows-arm64.zip
          )
          for file in "${files[@]}"; do
            test -s "$file" || { printf 'Missing release archive: %s\n' "$file" >&2; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes ./*

  pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
